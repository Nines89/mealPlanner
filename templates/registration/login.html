{% extends 'base.html' %}

{% block title %}Accedi · Pianificatore dei pasti{% endblock %}

{% block content %}
<section class="mx-auto max-w-sm rounded-lg bg-white p-6 shadow-sm">
    <h1 class="mb-5 text-xl font-bold">Accedi</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div>
                <label class="mb-1 block text-sm font-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full rounded-md bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-700">Accedi</button>
    </form>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}Registrazione — Meal Planner{% endblock %}

{% block content %}

<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-center">Crea account</h1>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}

            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors|join:", " }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit"
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2 px-4 rounded-md transition-colors">
                Registrati
            </button>
        </form>
    </div>

    <p class="text-center text-sm text-gray-500 mt-4">
        Hai già un account?
        <a href="{% url 'login' %}" class="text-emerald-600 hover:underline">Accedi</a>
    </p>
</div>

{% endblock %}

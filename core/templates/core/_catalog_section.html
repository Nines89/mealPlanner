<section id="catalog-section" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-gray-700">📦 Catalogo</h2>
        <button
            hx-get="{% url 'core:catalog_partial' %}"
            hx-target="#catalog-section"
            hx-swap="outerHTML"
            class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-md transition-colors">
            🔄 Aggiorna
        </button>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="flex items-center gap-3">
            <span class="text-3xl font-bold text-emerald-600">{{ ingredient_count }}</span>
            <span class="text-gray-500 text-sm">ingredienti<br>disponibili</span>
        </div>

        <div class="flex items-center gap-3">
            <span class="text-3xl font-bold text-emerald-600">{{ meal_count }}</span>
            <span class="text-gray-500 text-sm">pasti<br>di sistema</span>
        </div>
    </div>
</section>

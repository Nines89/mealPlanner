{% extends "base.html" %}

{% block title %}Modifica ingrediente — Shopping list{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
    <a href="{% url 'core:shopping_list' %}?week={{ week_start|date:'Y-m-d' }}" class="text-sm font-medium text-emerald-700 hover:text-emerald-900">← Torna alla lista</a>
    <div class="mt-4 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
        <h1 class="text-xl font-bold text-gray-900">Modifica ingrediente</h1>
        <form method="post" class="mt-4 space-y-4">
            {% csrf_token %}
            <input type="hidden" name="week" value="{{ week_start|date:'Y-m-d' }}">
            <label class="block">
                <span class="mb-1 block text-sm font-medium text-gray-700">Nome</span>
                <input type="text" name="name" maxlength="100" required value="{{ row.name }}" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
            </label>
            <label class="block">
                <span class="mb-1 block text-sm font-medium text-gray-700">Quantità</span>
                <input type="text" name="quantity" maxlength="40" value="{{ row.edit_quantity }}" placeholder="Es. 250 g, 1,5 kg o 1 confezione" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
                <span class="mt-1 block text-xs text-gray-500">Lascia vuoto per le voci del piano per ripristinare la quantità calcolata.</span>
            </label>
            <div class="flex gap-3">
                <button type="submit" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">Salva</button>
                <a href="{% url 'core:shopping_list' %}?week={{ week_start|date:'Y-m-d' }}" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">Annulla</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

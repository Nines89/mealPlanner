<div class="rounded-2xl border border-gray-100 bg-white p-4 shadow-sm ring-1 ring-gray-900/5">
    <p class="text-[11px] font-semibold uppercase tracking-wide text-gray-400">{{ label }}</p>
    <p class="mt-1 text-2xl font-bold tracking-tight
        {% if tone == 'amber' %}text-amber-700
        {% elif tone == 'rose' %}text-rose-600
        {% elif tone == 'sky' %}text-sky-600
        {% else %}text-emerald-600{% endif %}">
        {{ effective|floatformat:0 }}{% if suffix %}{{ suffix }}{% endif %}
    </p>
    <p class="mt-1 text-xs text-gray-500">
        expected
        {% if expected %}{{ expected|floatformat:0 }}{% if suffix %}{{ suffix }}{% endif %}{% else %}—{% endif %}
    </p>
</div>
